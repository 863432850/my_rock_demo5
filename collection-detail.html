<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据采集明细 · 双碳管理系统</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<!--
  数据采集明细（数据采集管理 > 业务界面 > 数据采集明细）

  「采集流水」视角：一行 = 一条采集到的参数值。
    查询条件：数据时间（范围查询）+ 数据年度 + 数据月度
    列表按钮：只有「导出」→ 导出当前列表（筛选后）的数据为 Excel
    列表列：采集时间(年月日时分秒) / 数据年度 / 数据月度 / 生产线类型 / 生产线名称 /
            物料名称 / 参数名称 / 数据值 / 参数单位

  数据落在自己的 localStorage 键里（见 js/collection-detail.js 的 DC_ROW_KEY）。
-->
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header"></header>
    <div class="app-body">
      <aside class="app-sidebar">
        <nav class="sidebar-menu" id="sidebar-menu"></nav>
      </aside>
      <main class="app-main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content-area">

          <!-- 查询条件：数据时间（范围）+ 数据年度 + 数据月度，都可清空，留空 = 不限 -->
          <div class="filter-bar">
            <div class="filter-left">
              <div class="filter-item">
                <label for="dc-date-start">数据时间</label>
                <div class="range-pair">
                  <input type="date" id="dc-date-start" class="dc-date-input" />
                  <span class="tilde">至</span>
                  <input type="date" id="dc-date-end" class="dc-date-input" />
                </div>
              </div>
              <div class="filter-item">
                <label for="dc-year">数据年度</label>
                <select id="dc-year" class="year-select"></select>
              </div>
              <div class="filter-item">
                <label for="dc-month">数据月度</label>
                <select id="dc-month" class="year-select"></select>
              </div>
              <div class="filter-actions">
                <button type="button" class="btn btn-primary" id="dc-search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                  查询
                </button>
                <button type="button" class="btn" id="dc-reset">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                  重置
                </button>
              </div>
            </div>
          </div>

          <!-- 采集流水列表 -->
          <div class="section-card dc-card">
            <div class="dc-card-head">
              <div class="dc-head-actions">
                <button type="button" class="btn btn-primary" id="dc-export">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>
                  </svg>
                  导出
                </button>
              </div>
            </div>

            <div class="table-wrap dc-table-wrap">
              <table class="data-table dc-table">
                <thead>
                  <tr>
                    <th class="dc-col-time">采集时间</th>
                    <th class="dc-col-year">数据年度</th>
                    <th class="dc-col-month">数据月度</th>
                    <th class="dc-col-linetype">生产线类型</th>
                    <th class="dc-col-linename">生产线名称</th>
                    <th class="dc-col-mat">物料名称</th>
                    <th class="dc-col-param">参数名称</th>
                    <th class="dc-col-value">数据值</th>
                    <th class="dc-col-unit">参数单位</th>
                  </tr>
                </thead>
                <tbody id="dc-tbody"></tbody>
              </table>
            </div>

            <!-- 翻页（由 dcRenderPager() 渲染） -->
            <div class="dc-pager" id="dc-pager"></div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/report-config-store.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/collection-detail.js"></script>
</body>
</html>
